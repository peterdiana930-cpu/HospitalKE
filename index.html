<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Diana Rose Hospital</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f6fbf7} .header{background:white;padding:20px;text-align:center;border-bottom:4px solid #2e7d32} .header h1{color:#1b5e20} .nav{display:flex;background:white;box-shadow:0 2px 8px rgba(0,0,0,0.1)} .nav button{flex:1;padding:16px;border:none;background:white;cursor:pointer;font-weight:bold;color:#555} .nav button.active{background:#e8f5e9;color:#1b5e20;border-bottom:3px solid #2e7d32} .container{max-width:1000px;margin:20px auto;padding:0 15px} .card{background:white;padding:20px;border-radius:14px;margin-bottom:15px;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #e8f5e9} input,select{width:100%;padding:12px;margin:7px 0;border:1.5px solid #c8e6c9;border-radius:8px} .btn{background:#2e7d32;color:white;padding:13px;border:none;border-radius:8px;width:100%;font-weight:bold;cursor:pointer} table{width:100%;border-collapse:collapse} th,td{padding:10px;text-align:left;border-bottom:1px solid #eee} th{background:#e8f5e9;color:#1b5e20} .hidden{display:none!important} .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}</style></head><body>
<div class="header"><h1>🏥 Diana Rose Hospital</h1><p>Professional Care • Thika, Kenya • Dr. Peter & Diana</p></div>
<div class="nav"><button id="btn-dashboard" class="active" onclick="showTab('dashboard')">Dashboard</button><button id="btn-patients" onclick="showTab('patients')">Patients</button><button id="btn-doctors" onclick="showTab('doctors')">Doctors</button><button id="btn-appointments" onclick="showTab('appointments')">Appointments</button></div>
<div class="container">
<div id="dashboard" class="tab"><div class="stat"><div class="card" style="text-align:center"><h2 id="c-p" style="color:#2e7d32">0</h2><p>Patients</p></div><div class="card" style="text-align:center"><h2 id="c-d" style="color:#2e7d32">0</h2><p>Doctors</p></div><div class="card" style="text-align:center"><h2 id="c-a" style="color:#2e7d32">0</h2><p>Appointments</p></div></div><div class="card"><h3>Welcome Dr. Peter & Diana!</h3><p id="status">Loading...</p></div></div>
<div id="patients" class="tab hidden"><div class="card"><h3>Add Patient</h3><input id="p-name" placeholder="Full Name"><input id="p-county" placeholder="County"><input id="p-condition" placeholder="Condition"><input id="p-age" type="number" placeholder="Age"><button class="btn" onclick="addPatient()">Add Patient</button></div><div class="card"><h3>Patients - <span id="p-count">0</span></h3><table><thead><tr><th>Name</th><th>County</th><th>Condition</th><th>Age</th></tr></thead><tbody id="patients-list"></tbody></table></div></div>
<div id="doctors" class="tab hidden"><div class="card"><h3>Add Doctor</h3><input id="d-name" placeholder="Name"><input id="d-spec" placeholder="Specialization"><input id="d-phone" placeholder="Phone"><button class="btn" onclick="addDoctor()">Add Doctor</button></div><div class="card"><table><thead><tr><th>Name</th><th>Spec</th><th>Phone</th></tr></thead><tbody id="doctors-list"></tbody></table></div></div>
<div id="appointments" class="tab hidden"><div class="card"><h3>Book Appointment</h3><select id="a-patient"></select><select id="a-doctor"></select><input id="a-date" type="date"><input id="a-time" type="time"><input id="a-reason" placeholder="Reason"><button class="btn" onclick="addAppointment()">Book</button></div><div class="card"><table><thead><tr><th>Date</th><th>Time</th><th>Reason</th></tr></thead><tbody id="appointments-list"></tbody></table></div></div>
</div>
<script>
const sb=supabase.createClient("https://xhguvilkavzkydkkeajgf.supabase.co","sb_publishable_tapBaeOUfFI-Ax1r6XtVdw_8VDqAzNg");
function showTab(n){document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden'));document.getElementById(n).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+n).classList.add('active');loadData();}
async function loadData(){let p=await sb.from('patients').select('*').order('id',{ascending:false});let d=await sb.from('doctors').select('*').order('id',{ascending:false});let a=await sb.from('appointments').select('*').order('id',{ascending:false});if(p.error){document.getElementById('status').innerText="Error: "+p.error.message;console.log(p.error);return;}document.getElementById('status').innerText="✅ System Online - Professional Light Green & White";document.getElementById('c-p').innerText=p.data.length;document.getElementById('c-d').innerText=d.data.length;document.getElementById('c-a').innerText=a.data.length;document.getElementById('p-count').innerText=p.data.length;document.getElementById('patients-list').innerHTML=p.data.map(x=>`<tr><td>${x.name}</td><td>${x.county||''}</td><td>${x.condition||''}</td><td>${x.age||''}</td></tr>`).join('')||'<tr><td colspan=4>No patients yet</td></tr>';document.getElementById('doctors-list').innerHTML=d.data.map(x=>`<tr><td>${x.name}</td><td>${x.specialization}</td><td>${x.phone||''}</td></tr>`).join('');document.getElementById('appointments-list').innerHTML=a.data.map(x=>`<tr><td>${x.date}</td><td>${x.time}</td><td>${x.reason||''}</td></tr>`).join('');document.getElementById('a-patient').innerHTML=p.data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');document.getElementById('a-doctor').innerHTML=d.data.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');}
async function addPatient(){let n=document.getElementById('p-name').value;if(!n)return alert('Enter name');let r=await sb.from('patients').insert([{name:n,county:document.getElementById('p-county').value,condition:document.getElementById('p-condition').value,age:document.getElementById('p-age').value?parseInt(document.getElementById('p-age').value):null}]);if(r.error)alert(r.error.message);else{alert('Added');loadData();}}
async function addDoctor(){let r=await sb.from('doctors').insert([{name:document.getElementById('d-name').value,specialization:document.getElementById('d-spec').value,phone:document.getElementById('d-phone').value}]);if(r.error)alert(r.error.message);else{alert('Added');loadData();}}
async function addAppointment(){let r=await sb.from('appointments').insert([{patient_id:document.getElementById('a-patient').value,doctor_id:document.getElementById('a-doctor').value,date:document.getElementById('a-date').value,time:document.getElementById('a-time').value,reason:document.getElementById('a-reason').value}]);if(r.error)alert(r.error.message);else{alert('Booked');loadData();}}
loadData();
</script></body></html>
