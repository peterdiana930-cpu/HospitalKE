<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana Rose Hospital - Professional - Owner 0756255760</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
body{background:#F8FAFC;color:#0F172A;font-size:13px}
:root{--navy:#0F172A;--blue:#1E40AF;--line:#E2E8F0;--bg:#F8FAFC;--white:#fff;--muted:#64748B}
.top{height:60px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:20}
.logo{width:32px;height:32px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff}
.app{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:260px;background:var(--navy);color:#CBD5E1;padding:12px 10px;flex-shrink:0}
.s-title{font-size:10px;font-weight:700;letter-spacing:.8px;color:#64748B;margin:16px 0 6px 10px;text-transform:uppercase}
.s-link{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#94A3B8;text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;margin:2px 0}
.s-link:hover{background:#1E293B;color:#fff}
.s-link.active{background:var(--white);color:var(--navy)}
.s-link i{width:18px;text-align:center}
.main{flex:1;background:var(--bg);padding:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:12px}
.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin:4px 0;outline:none}
.input:focus{border-color:var(--blue)}
.btn{padding:10px 16px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer}
.btn-blue{background:var(--navy);color:#fff} .btn-white{background:var(--white);border:1px solid var(--line);color:var(--navy)}
.table-wrap{overflow:auto;border-radius:10px;border:1px solid var(--line);background:var(--white);margin-top:12px}
.table{width:100%;border-collapse:collapse;min-width:650px}
.table th{background:#F8FAFC;padding:10px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
.table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #F1F5F9}
.badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.b-green{background:#DCFCE7;color:#166534} .b-blue{background:#DBEAFE;color:#1E40AF} .b-amber{background:#FEF3C7;color:#92400E}
.login-bg{position:fixed;inset:0;background:#F1F5F9;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.login-box{background:var(--white);border:1px solid var(--line);border-radius:16px;width:380px;max-width:100%;padding:24px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
.tabs{display:flex;background:#F1F5F9;border-radius:8px;padding:4px;margin:16px 0}
.tab{flex:1;padding:8px;border-radius:6px;border:none;background:transparent;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.tab.active{background:var(--white);color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.small{font-size:11px;color:var(--muted);font-weight:500}
.hidden{display:none}
@media(max-width:800px){.app{flex-direction:column}.sidebar{width:100%}}
</style></head><body>

<div id="loginScreen" class="login-bg">
<div class="login-box">
<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
<div class="logo"><i class="fa-solid fa-heart-pulse"></i></div>
<div><b style="font-size:15px">Diana Rose Hospital</b><br><small style="font-size:11px;color:var(--muted)">Hospital Management System</small></div>
</div>

<div class="tabs">
<button id="tabStaff" class="tab active" onclick="switchTab('staff')">Staff</button>
<button id="tabPatient" class="tab" onclick="switchTab('patient')">Patient</button>
</div>

<div id="staffBox">
<input id="u" class="input" placeholder="Username" value="admin">
<input id="p" class="input" type="password" placeholder="Password" value="admin123">
<button class="btn btn-blue" style="width:100%;margin-top:12px" onclick="loginStaff()">Sign In</button>
<div class="small" style="margin-top:12px;background:#F8FAFC;border:1px solid var(--line);border-radius:8px;padding:10px">
<b>Demo accounts</b><br>
admin / admin123 — Admin<br>
doctor / doctor123 — Doctor<br>
nurse / nurse123 — Nurse<br>
reception / recep123 — Reception
</div>
</div>

<div id="patientBox" class="hidden">
<input id="pid" class="input" placeholder="Patient ID" value="P-001245">
<input id="pphone" class="input" placeholder="Phone" value="0712345678">
<button class="btn btn-blue" style="width:100%;margin-top:12px" onclick="loginPatient()">Sign In</button>
<div class="small" style="margin-top:12px">Demo: P-001245 / 0712345678</div>
</div>

<div id="loginError" class="hidden" style="margin-top:10px;background:#FEE2E2;border:1px solid #FECACA;color:#991B1B;padding:8px;border-radius:8px;font-size:12px"></div>
</div>
</div>

<div class="top hidden" id="topBar">
<div style="display:flex;align-items:center;gap:10px">
<div class="logo"><i class="fa-solid fa-heart-pulse"></i></div>
<div><b style="font-size:14px">Diana Rose Hospital</b><br><small style="font-size:11px;color:var(--muted)">Thika • Owner 0756255760</small></div>
</div>
<div style="display:flex;align-items:center;gap:10px">
<span id="roleBadge" style="background:#F1F5F9;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:11px;font-weight:700">ADMIN</span>
<button class="btn btn-white" style="padding:6px 12px;font-size:12px" onclick="logout()">Logout</button>
</div>
</div>

<div class="app hidden" id="app">
<div class="sidebar" id="sidebar"></div>
<div class="main" id="main"></div>
</div>

<script>
let users={admin:"admin123",doctor:"doctor123",nurse:"nurse123",reception:"recep123"};
let patients=[
{id:'P-001245',name:'Mary Wanjiku',phone:'0712345678',room:'Ward A-12 Bed 4',diagnosis:'Malaria + Typhoid',doctor:'Dr Kimani',status:'Admitted'},
{id:'P-001246',name:'John Mwangi',phone:'0722123456',room:'Theatre 1',diagnosis:'Appendicitis',doctor:'Dr Kimani',status:'In Theatre'},
{id:'P-001247',name:'Amina Yusuf',phone:'0733123456',room:'Maternity Bed 5',diagnosis:'Labor',doctor:'Dr Njoroge',status:'Delivered'}
];
let appointments=[
{date:'06 Nov 09:00',patient:'Mary Wanjiku',doctor:'Dr Kimani',dept:'Medicine',status:'Confirmed'},
{date:'06 Nov 10:30',patient:'John Mwangi',doctor:'Dr Njoroge',dept:'Surgery',status:'Upcoming'}
];
let currentRole='';

function switchTab(t){
document.getElementById('tabStaff').classList.toggle('active',t==='staff');
document.getElementById('tabPatient').classList.toggle('active',t==='patient');
document.getElementById('staffBox').classList.toggle('hidden',t!=='staff');
document.getElementById('patientBox').classList.toggle('hidden',t!=='patient');
document.getElementById('loginError').classList.add('hidden');
}
function loginStaff(){
let u=document.getElementById('u').value.trim().toLowerCase();
let p=document.getElementById('p').value.trim();
let err=document.getElementById('loginError');
if(!users[u]||users[u]!==p){err.textContent='Invalid username or password. Try admin / admin123';err.classList.remove('hidden');return;}
currentRole=u;
openApp(u);
}
function loginPatient(){
let id=document.getElementById('pid').value.trim().toUpperCase();
let phone=document.getElementById('pphone').value.trim();
let err=document.getElementById('loginError');
if(id!=='P-001245'||phone!=='0712345678'){err.textContent='Invalid patient ID or phone. Use P-001245 / 0712345678';err.classList.remove('hidden');return;}
currentRole='patient';
openApp('patient');
}
function openApp(role){
document.getElementById('loginScreen').classList.add('hidden');
document.getElementById('topBar').classList.remove('hidden');
document.getElementById('app').classList.remove('hidden');
document.getElementById('roleBadge').textContent=role.toUpperCase();
buildSidebar(role);
showPage('patients');
}
function logout(){
document.getElementById('loginScreen').classList.remove('hidden');
document.getElementById('topBar').classList.add('hidden');
document.getElementById('app').classList.add('hidden');
}
function buildSidebar(role){
let html='';
if(role==='admin'){
html+=`
<div class="s-title">Main</div>
<a class="s-link active" onclick="showPage('patients')"><i class="fa-solid fa-users"></i> Patients</a>
<a class="s-link" onclick="showPage('doctors')"><i class="fa-solid fa-user-doctor"></i> Doctors</a>
<a class="s-link" onclick="showPage('nurses')"><i class="fa-solid fa-user-nurse"></i> Nurses</a>
<a class="s-link" onclick="showPage('reception')"><i class="fa-solid fa-bell-concierge"></i> Reception</a>
<a class="s-link" onclick="showPage('pharmacy')"><i class="fa-solid fa-pills"></i> Pharmacy</a>
<a class="s-link" onclick="showPage('lab')"><i class="fa-solid fa-vials"></i> Laboratory</a>
<a class="s-link" onclick="showPage('beds')"><i class="fa-solid fa-bed"></i> Beds</a>
<a class="s-link" onclick="showPage('billing')"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a>
<a class="s-link" onclick="showPage('stores')"><i class="fa-solid fa-boxes-stacked"></i> Stores</a>
`;
}else if(role==='doctor'){
html+=`
<div class="s-title">Doctor Access</div>
<a class="s-link active" onclick="showPage('patients')"><i class="fa-solid fa-users"></i> My Patients</a>
<a class="s-link" onclick="showPage('appointments')"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
<a class="s-link" onclick="showPage('medical')"><i class="fa-solid fa-file-medical"></i> Medical Records</a>
<a class="s-link" onclick="showPage('lab')"><i class="fa-solid fa-vials"></i> Laboratory</a>
<a class="s-link" onclick="showPage('beds')"><i class="fa-solid fa-bed"></i> Beds</a>
`;
}else if(role==='nurse'){
html+=`
<div class="s-title">Nurse Access</div>
<a class="s-link active" onclick="showPage('patients')"><i class="fa-solid fa-users"></i> Patients</a>
<a class="s-link" onclick="showPage('beds')"><i class="fa-solid fa-bed"></i> Beds & Vitals</a>
<a class="s-link" onclick="showPage('nurses')"><i class="fa-solid fa-user-nurse"></i> Nursing Records</a>
`;
}else if(role==='reception'){
html+=`
<div class="s-title">Reception Access</div>
<a class="s-link active" onclick="showPage('patients')"><i class="fa-solid fa-users"></i> Patients</a>
<a class="s-link" onclick="showPage('appointments')"><i class="fa-solid fa-calendar-check"></i> Appointments</a>
<a class="s-link" onclick="showPage('reception')"><i class="fa-solid fa-bell-concierge"></i> Front Office</a>
`;
}else if(role==='patient'){
html+=`
<div class="s-title">My Access</div>
<a class="s-link active" onclick="showPage('myrecords')"><i class="fa-solid fa-file-medical"></i> My Records</a>
<a class="s-link" onclick="showPage('mybills')"><i class="fa-solid fa-file-invoice-dollar"></i> My Bills</a>
<a class="s-link" onclick="showPage('myappts')"><i class="fa-solid fa-calendar-check"></i> My Appointments</a>
`;
}
html+=`<div style="margin-top:20px;padding:10px;background:#1E293B;border-radius:10px"><b style="font-size:11px;color:#fff">Owner 0756255760</b><br><small style="font-size:10px;color:#94A3B8">Clean • Professional • No wordy text</small></div>`;
document.getElementById('sidebar').innerHTML=html;
}

function showPage(id){
let main=document.getElementById('main');
document.querySelectorAll('.s-link').forEach(l=>l.classList.remove('active'));
event?.target?.closest?.('.s-link')?.classList.add('active');

if(id==='patients') main.innerHTML=renderPatients();
if(id==='doctors') main.innerHTML=renderDoctors();
if(id==='nurses') main.innerHTML=renderNurses();
if(id==='reception') main.innerHTML=renderReception();
if(id==='pharmacy') main.innerHTML=renderPharmacy();
if(id==='lab') main.innerHTML=renderLab();
if(id==='beds') main.innerHTML=renderBeds();
if(id==='billing') main.innerHTML=renderBilling();
if(id==='stores') main.innerHTML=renderStores();
if(id==='appointments') main.innerHTML=renderAppointments();
if(id==='medical') main.innerHTML=renderMedical();
if(id==='myrecords') main.innerHTML=renderMyRecords();
if(id==='mybills') main.innerHTML=renderMyBills();
if(id==='myappts') main.innerHTML=renderMyAppts();
}

function renderPatients(){
return `
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
<div><h2 style="font-size:17px">Patients</h2><p style="font-size:12px;color:var(--muted)">Patient registration and records</p></div>
<button class="btn btn-blue" onclick="toggleAdd()"><i class="fa-solid fa-user-plus"></i> Add Patient</button>
</div>

<div id="addBox" class="card hidden" style="margin-bottom:14px">
<h2>Add Patient</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<input id="pName" class="input" placeholder="Full name">
<input id="pPhone" class="input" placeholder="Phone">
<input id="pRoom" class="input" placeholder="Room / Ward">
<input id="pDoctor" class="input" placeholder="Doctor">
<input id="pDiagnosis" class="input" placeholder="Diagnosis" style="grid-column:span 2">
</div>
<button class="btn btn-blue" style="width:100%;margin-top:10px" onclick="addPatient()">Save Patient</button>
<div id="pResult" style="margin-top:8px;font-size:12px"></div>
</div>

<div class="card">
<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Ward</th><th>Diagnosis</th><th>Doctor</th><th>Status</th></tr></thead><tbody id="ptable">${patients.map(p=>`<tr><td>${p.id}</td><td><b>${p.name}</b></td><td>${p.phone}</td><td>${p.room}</td><td>${p.diagnosis}</td><td>${p.doctor}</td><td><span class="badge b-blue">${p.status}</span></td></tr>`).join('')}</tbody></table></div>
</div>`;
}

function renderDoctors(){
return `<div class="card"><h2>Doctors</h2><p style="font-size:12px;color:var(--muted)">Doctor profiles and departments</p>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px">
<div class="card" style="background:#F8FAFC"><b>Dr A. Kimani</b><br><small>Medicine • Mon-Fri 8am-5pm</small><br><span class="badge b-blue" style="margin-top:8px">5 patients</span></div>
<div class="card" style="background:#F8FAFC"><b>Dr Njoroge</b><br><small>Surgery • On call</small><br><span class="badge b-amber" style="margin-top:8px">In theatre</span></div>
<div class="card" style="background:#F8FAFC"><b>Dr Otieno</b><br><small>Emergency • 24/7</small><br><span class="badge b-green" style="margin-top:8px">On duty</span></div>
</div></div>`;
}
function renderNurses(){return `<div class="card"><h2>Nurses</h2><p style="font-size:12px;color:var(--muted)">Nursing records and bed management</p><div style="margin-top:12px"><b>Ward A - Medicine</b><br><small>45/60 occupied • 15 available</small><br><b style="margin-top:8px;display:inline-block">Bed 4: Mary Wanjiku - Malaria</b></div></div>`;}
function renderReception(){return `<div class="card"><h2>Reception</h2><p style="font-size:12px;color:var(--muted)">Front office and appointments</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><div style="background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center"><b style="font-size:18px">24</b><br><small>Tokens today</small></div><div style="background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center"><b style="font-size:18px">12</b><br><small>Visitors</small></div></div></div>`;}
function renderPharmacy(){return `<div class="card"><h2>Pharmacy</h2><p style="font-size:12px;color:var(--muted)">Medicine inventory</p><div class="table-wrap"><table class="table"><thead><tr><th>Medicine</th><th>Stock</th><th>Shelf</th><th>Expiry</th><th>Status</th></tr></thead><tbody><tr><td>Paracetamol 500mg</td><td>15</td><td>A-12</td><td>2026-11-20</td><td><span class="badge b-amber">Low stock</span></td></tr><tr><td>Amoxicillin 500mg</td><td>120</td><td>B-04</td><td>2027-06-15</td><td><span class="badge b-green">Available</span></td></tr></tbody></table></div></div>`;}
function renderLab(){return `<div class="card"><h2>Laboratory</h2><p style="font-size:12px;color:var(--muted)">Tests and samples</p><div style="margin-top:10px"><b>Sample #S-2026-1123</b> — Mary Wanjiku — Malaria Positive — Sent to Dr Kimani</div></div>`;}
function renderBeds(){return `<div class="card"><h2>Beds</h2><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;margin-top:10px"><div style="background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:12px"><b>Ward A</b><br><small>45/60 • Bed 4: Mary Wanjiku</small></div><div style="background:#FEF3C7;border:1px solid #FDE68A;border-radius:10px;padding:12px"><b>ICU</b><br><small>3/10 • Critical</small></div><div style="background:#DCFCE7;border:1px solid #BBF7D0;border-radius:10px;padding:12px"><b>Maternity</b><br><small>12/20 • Bed 5: Amina Yusuf</small></div><div style="background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:12px"><b>Theatre</b><br><small>1/2 • John Mwangi</small></div></div></div>`;}
function renderBilling(){return `<div class="card"><h2>Billing</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Patient</th><th>Amount</th><th>Payment</th><th>Receipt</th><th>Status</th></tr></thead><tbody><tr><td>03 Nov 2026</td><td>Mary Wanjiku</td><td>KSh 8,700</td><td>M-Pesa QGH7Y2</td><td>RCPT-2026-1123</td><td><span class="badge b-green">Paid</span></td></tr></tbody></table></div></div>`;}
function renderStores(){return `<div class="card"><h2>Stores</h2><p style="font-size:12px;color:var(--muted)">Pharmacy, lab and central stores</p><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px"><div style="border:1px solid var(--line);border-radius:10px;padding:12px"><b>Pharmacy Store</b><br><small>Paracetamol 15 left • Shelf A-12</small></div><div style="border:1px solid var(--line);border-radius:10px;padding:12px"><b>Lab Store</b><br><small>Malaria kits 50 • Shelf L-02</small></div><div style="border:1px solid var(--line);border-radius:10px;padding:12px"><b>Central Store</b><br><small>Bed sheets 100 • Gloves 500</small></div></div></div>`;}
function renderAppointments(){return `<div class="card"><h2>Appointments</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Patient</th><th>Doctor</th><th>Department</th><th>Status</th></tr></thead><tbody>${appointments.map(a=>`<tr><td>${a.date}</td><td>${a.patient}</td><td>${a.doctor}</td><td>${a.dept}</td><td><span class="badge b-blue">${a.status}</span></td></tr>`).join('')}</tbody></table></div></div>`;}
function renderMedical(){return `<div class="card"><h2>Medical Records</h2><div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>Diagnosis</th><th>Prescription</th><th>Doctor</th></tr></thead><tbody>${patients.map(p=>`<tr><td>${p.name} • ${p.room}</td><td>${p.diagnosis}</td><td>IV Quinine, Paracetamol</td><td>${p.doctor}</td></tr>`).join('')}</tbody></table></div></div>`;}
function renderMyRecords(){return `<div class="card"><h2>My Records - P-001245</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:13px"><div><b>ID:</b> P-001245</div><div><b>Ward:</b> Ward A-12 Bed 4</div><div><b>Name:</b> Mary Wanjiku</div><div><b>Phone:</b> 0712345678</div><div><b>Doctor:</b> Dr Kimani</div><div><b>Diagnosis:</b> Malaria + Typhoid</div><div><b>Bill:</b> KSh 12,200</div><div><b>Receipt:</b> RCPT-2026-1123</div></div></div>`;}
function renderMyBills(){return `<div class="card"><h2>My Bills</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Amount</th><th>Payment</th><th>Receipt</th><th>Status</th></tr></thead><tbody><tr><td>03 Nov 2026</td><td>KSh 8,700</td><td>M-Pesa QGH7Y2</td><td>RCPT-2026-1123</td><td><span class="badge b-green">Paid</span></td></tr></tbody></table></div></div>`;}
function renderMyAppts(){return `<div class="card"><h2>My Appointments</h2><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Doctor</th><th>Reason</th><th>Status</th></tr></thead><tbody><tr><td>06 Nov 09:00</td><td>Dr Kimani</td><td>Follow-up</td><td><span class="badge b-blue">Confirmed</span></td></tr></tbody></table></div></div>`;}

function toggleAdd(){document.getElementById('addBox').classList.toggle('hidden');}
function addPatient(){
let name=document.getElementById('pName').value.trim();
let phone=document.getElementById('pPhone').value.trim();
let room=document.getElementById('pRoom').value.trim();
let doctor=document.getElementById('pDoctor').value.trim();
let diagnosis=document.getElementById('pDiagnosis').value.trim();
let res=document.getElementById('pResult');
if(!name||!phone||!room||!diagnosis){res.innerHTML='<span style="color:#DC2626">Please fill all fields</span>';return;}
let id='P-00'+(1245+patients.length+1);
patients.push({id:id,name:name,phone:phone,room:room,diagnosis:diagnosis,doctor:doctor||'Dr Kimani',status:'Admitted'});
res.innerHTML='<span style="color:#166534">Patient added: '+id+' - '+name+'</span>';
document.getElementById('pName').value='';document.getElementById('pPhone').value='';document.getElementById('pRoom').value='';document.getElementById('pDoctor').value='';document.getElementById('pDiagnosis').value='';
let tbody=document.getElementById('ptable');
if(tbody) tbody.innerHTML=patients.map(p=>`<tr><td>${p.id}</td><td><b>${p.name}</b></td><td>${p.phone}</td><td>${p.room}</td><td>${p.diagnosis}</td><td>${p.doctor}</td><td><span class="badge b-blue">${p.status}</span></td></tr>`).join('');
}
</script>
</body>
</html>
