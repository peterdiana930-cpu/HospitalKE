<script>
// ... (keep all your previous code) 

// FIXED APPOINTMENTS RENDER WITH BILL BUTTON
function renderStaff(){
let p=getData('patients');let d=getData('doctors');let m=getData('medicines');let a=getData('appointments');
document.getElementById('c-p').innerText=p.length;document.getElementById('c-d').innerText=d.length;document.getElementById('c-ph').innerText=m.length;
let total=p.reduce((s,x)=>s+(parseInt(x.bill)||0),0);
document.getElementById('c-money').innerText=total.toLocaleString();
document.getElementById('hub-p').innerText=p.length+" patients";document.getElementById('hub-ph').innerText=m.length+" medicines";document.getElementById('hub-d').innerText=d.length+" doctors";document.getElementById('hub-a').innerText=a.length+" today";document.getElementById('hub-money').innerText="KSh "+total.toLocaleString();
document.getElementById('p-count').innerText=p.length;
let td=document.getElementById('today-date');if(td)td.innerText=new Date().toLocaleDateString();
let rt=document.getElementById('r-total');if(rt){rt.innerText="KSh "+total.toLocaleString();document.getElementById('r-mpesa').innerText="KSh "+p.filter(x=>x.pay==='M-Pesa').reduce((s,x)=>s+(parseInt(x.bill)||0),0).toLocaleString();document.getElementById('r-cash').innerText="KSh "+p.filter(x=>x.pay==='Cash').reduce((s,x)=>s+(parseInt(x.bill)||0),0).toLocaleString();document.getElementById('r-count').innerText=p.length;}
document.getElementById('patients-list').innerHTML=p.map((x,i)=>`<tr><td><b>${x.name}</b></td><td>${x.phone||''}</td><td style="color:#1b5e20;font-weight:bold">KSh ${x.bill||0}</td><td><button class="btn btn-small" onclick="printReceipt(${i})">🧾</button> <button class="btn btn-small" style="background:#0288d1;margin-left:4px" onclick="editBill(${i})">💰 Edit Bill</button></td></tr>`).join('');
document.getElementById('pharmacy-list').innerHTML=m.map((x,i)=>`<tr><td><b>${x.name}</b></td><td>${x.stock}</td><td>KSh ${x.price}</td><td><button class="btn btn-small" style="background:#c62828" onclick="useMedicine(${i})">Use</button></td></tr>`).join('');
document.getElementById('reports-list').innerHTML=p.map(x=>`<tr><td>${x.name}</td><td style="color:#1b5e20;font-weight:bold">KSh ${x.bill||0}</td><td>${x.pay}</td></tr>`).join('');
document.getElementById('doctors-list').innerHTML=d.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.specialization}</td><td>${x.phone||''}</td></tr>`).join('');
// NEW APPOINTMENTS WITH BILL BUTTON
document.getElementById('appointments-list').innerHTML=a.map((x,idx)=>`<tr><td>${x.date} ${x.time}</td><td><b>${x.patientName||''}</b></td><td>${x.doctorName||''}</td><td>${x.reason||''}</td><td><button class="btn btn-small" style="background:#2e7d32" onclick="billFromAppointment(${idx})">💰 Add Bill</button></td></tr>`).join('')||'<tr><td colspan=5 style="text-align:center;color:#999">No appointments</td></tr>';
document.getElementById('p-medicine').innerHTML='<option value="">Select Medicine</option>'+m.map(x=>`<option value="${x.name}">${x.name} (${x.stock})</option>`).join('');
document.getElementById('a-patient').innerHTML='<option value="">Patient</option>'+p.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
document.getElementById('a-doctor').innerHTML='<option value="">Doctor</option>'+d.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');
document.getElementById('pat-doctor').innerHTML='<option value="">Select Doctor</option>'+d.map(x=>`<option value="${x.id}">${x.name} - ${x.specialization}</option>`).join('');
}

function billFromAppointment(appIdx){
let apps=getData('appointments');let app=apps[appIdx];let patients=getData('patients');let medicines=getData('medicines');
let patIdx=patients.findIndex(p=>p.id==app.patientId || p.name==app.patientName);
if(patIdx==-1){alert("❌ Patient not found! Create patient first with same name: "+app.patientName);sideNav('patients');return;}
let bill=prompt("Enter Bill for "+app.patientName+" ("+app.reason+") - KSh:", patients[patIdx].bill||"1500");
if(bill===null)return;
let med=prompt("Enter Medicine for "+app.patientName+" (available: "+medicines.map(m=>m.name).join(', ')+"):", patients[patIdx].medicine||"Paracetamol");
if(med===null)return;
let pay=prompt("Payment Method - M-Pesa / Cash / Insurance:", patients[patIdx].pay||"M-Pesa");
if(pay===null)return;
// update patient
patients[patIdx].bill=parseInt(bill)||0;patients[patIdx].medicine=med;patients[patIdx].pay=pay;
setData('patients',patients);
// update medicine stock
let medFound=medicines.find(x=>x.name.toLowerCase()==med.toLowerCase());
if(medFound && medFound.stock>0){medFound.stock--;setData('medicines',medicines);}
alert("✅ Bill Added! "+app.patientName+" now has KSh "+bill+" + "+med+" — Patient will see it in Patient Portal!");
renderStaff();
}

function editBill(pIdx){
let patients=getData('patients');let p=patients[pIdx];
let bill=prompt("Edit Bill for "+p.name+" - KSh:", p.bill||"0");
if(bill===null)return;
let med=prompt("Edit Medicine for "+p.name+":", p.medicine||"");
if(med===null)return;
let pay=prompt("Payment Method:", p.pay||"M-Pesa");
if(pay===null)return;
patients[pIdx].bill=parseInt(bill)||0;patients[pIdx].medicine=med;patients[pIdx].pay=pay;
setData('patients',patients);
alert("✅ Bill updated for "+p.name+"!");
renderStaff();
}
</script>
