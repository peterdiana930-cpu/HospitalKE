<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HospitalKE - Kenya Health System</title><style>body{font-family:Segoe UI,Arial;background:#f0f5ff;margin:0}header{background:#0b5cff;color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}.hero{background:linear-gradient(135deg,#0b5cff,#00d1ff);color:#fff;padding:30px;text-align:center}.box{max-width:1000px;margin:20px auto;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 12px}@media(max-width:700px){.box{grid-template-columns:1fr}}.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 8px 20px rgba(0,0,0,.08)}input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{background:#0b5cff;color:#fff;border:0;padding:12px;border-radius:10px;width:100%;font-weight:bold;cursor:pointer;font-size:15px}button:hover{background:#084bcc}.row{background:#f8fbff;border:1px solid #e6efff;padding:12px;border-radius:10px;margin-top:8px;display:flex;justify-content:space-between}.badge{background:#dcfce7;color:#166534;padding:4px 10px;border-radius:20px;font-size:12px}.stat{display:flex;gap:10px;margin-top:10px}.stat div{background:#fff;border-radius:12px;padding:10px 14px;flex:1;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}a{color:#0b5cff}</style></head><body><header><b>🏥 HospitalKE</b><span style="background:#fff;color:#0b5cff;padding:6px 12px;border-radius:20px;font-size:12px">KENYA LIVE</span></header><div class="hero"><h1 style="margin:0">Smart Hospital Management</h1><p>Frontend LIVE + Backend LIVE on Render - Full Stack System</p><div class="stat"><div><b id="c">0</b><br><small>Patients</small></div><div><b>Kenya</b><br><small>Coverage</small></div><div><b>24/7</b><br><small>Active</small></div></div><button onclick="load()" style="width:auto;margin-top:16px;background:#fff;color:#0b5cff;padding:10px 24px">🔄 Refresh</button></div><div class="box"><div class="card"><h3 style="margin-top:0">➕ Add New Patient</h3><input id="n" placeholder="Full Name e.g. Peter Otieno"><input id="a" placeholder="Age" type="number"><select id="co"><option>Nairobi</option><option>Kisumu</option><option>Mombasa</option><option>Nakuru</option><option>Eldoret</option><option>Kakamega</option><option>Kiambu</option></select><input id="cond" placeholder="Condition e.g. Malaria Checkup"><button onclick="add()">💾 Save Patient to Database</button><p id="m" style="font-size:13px;margin-top:10px"></p><small>Backend API: <a href="https://hospitalke.onrender.com/api/patients" target="_blank">hospitalke.onrender.com/api/patients</a></small></div><div class="card"><h3 style="margin-top:0">👥 Patients List</h3><div id="l">Loading from Render...</div></div></div><script>const API="https://hospitalke.onrender.com";async function load(){const d=document.getElementById("l");d.innerHTML="⏳ Waking up Render (wait 30s first time)...";try{const r=await fetch(API+"/api/patients");const j=await r.json();document.getElementById("c").innerText=j.total;if(!j.patients||!j.patients.length){d.innerHTML="<i style='color:#666'>No patients yet - Add your first patient on the left!</i>";return}d.innerHTML=j.patients.map(p=>`<div class=row><div><b>#${p.id} ${p.name}</b><br><small>${p.county||''} • Age ${p.age||''}</small></div><div><span class=badge>${p.condition||'New'}</span></div></div>`).join("")}catch(e){d.innerHTML=`❌ Render sleeping - Click Refresh again in 20 seconds<br><small>${e}</small>`}}async function add(){const name=document.getElementById("n").value.trim();const age=document.getElementById("a").value;const county=document.getElementById("co").value;const condition=document.getElementById("cond").value||"Checkup";if(!name)return alert("Enter patient name");document.getElementById("m").innerText="⏳ Saving to database...";try{const r=await fetch(API+"/api/patients",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,age:parseInt(age)||25,county,condition})});const j=await r.json();document.getElementById("m").innerText="✅ "+j.message+" Saved!";document.getElementById("n").value="";document.getElementById("a").value="";document.getElementById("cond").value="";load()}catch(e){document.getElementById("m").innerText="❌ Failed - Render waking up, try again"}}load();</script></body></html>
