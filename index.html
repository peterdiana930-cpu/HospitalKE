function setTab(t){document.getElementById("bStaff").style.background=t==="staff"?"#fff":"transparent";document.getElementById("bPatient").style.background=t==="patient"?"#fff":"transparent";document.getElementById("staffBox").classList.toggle("hidden",t!=="staff");document.getElementById("patientBox").classList.toggle("hidden",t!=="patient");}

function openApp(role){document.getElementById("loginScreen").classList.add("hidden");document.getElementById("topBar").classList.remove("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("roleBadge").textContent=role.toUpperCase();if(role==="patient") document.getElementById("patientEmergencyBtn").classList.remove("hidden");buildSidebar(role);if(role==="patient") showMyRecords();else if(role==="nurse") showNursePage();else if(role==="doctor") showDoctorPage();else showDashboard();}

 Patients</a><a class="s-link" onclick="showNurseVitals()"><i class="fa-solid fa-heart-pulse"></i> Add Vitals - Working</a><a class="s-link" onclick="showNurseNotes()"><i class="fa-solid fa-comment-medical"></i> Comment on Health</a><a class="s-link" onclick="showWards()"><i class="fa-solid fa-bed"></i> How Are Beds 42/120</a><a class="s-link" onclick="showEmergencyList()"><i class="fa-solid fa-triangle-exclamation"></i> Emergency</a>';}else{h='<div class="s-group">Patient Only</div><a class="s-link active" onclick="showMyRecords()"><i class="fa-solid fa-file-medical"></i> My Records</a><a class="s-link" onclick="showMyBills()"><i class="fa-solid fa-file-invoice-dollar"></i> My Bills - Pay</a><a class="s-link" onclick="showMyAppts()"><i class="fa-solid fa-calendar-check"></i> My Appointments</a>';}h+='<div style="margin-top:24px;padding:14px;background:#1E293B;border-radius:12px"><b style="font-size:11px;color:#fff">Owner 0756255760 - Final Evidence</b><br><small style="font-size:10px;color:#94A3B8">Clean Not Stuffy - Separate - Everything in Page</small></div>';document.getElementById("sidebar").innerHTML=h;}
function renderStaffTable(){var rows="";for(var i=0;i<staffs.length;i++){var s=staffs[i];rows+="<tr><td>"+s.id+"</td><td><b>"+s.name+"</b></td><td>"+s.role+"</td><td>"+s.dept+"</td><td>"+s.room+"</td><td>"+s.assignedPatients+" Patients</td><td>"+s.phone+"</td><td><span class=\"badge b-green\">"+s.status+"</span></td></tr>";}return rows;}

function showNursePage(){var assigned=[];for(var i=0;i<patients.length;i++){if(patients[i].id==="P-001245"||patients[i].id==="P-001247") assigned.push(patients[i]);}var rows="";for(var i=0;i<assigned.length;i++){var p=assigned[i];rows+="<tr><td>"+p.id+"</td><td><b>"+p.name+"</b></td><td>"+p.room+"</td><td>"+p.diagnosis+"</td><td>"+p.vitals.bp+", "+p.vitals.temp+", "+p.vitals.pulse+", "+p.vitals.spo2+"</td><td>"+p.nursingNote+"</td><td><button class=\"btn-white\" style=\"padding:6px 12px;font-size:11px\" onclick=\"showNurseVitalsFor('"+p.id+"')\">Add Vitals</button></td></tr>";}var html='<div class="card"><h2>Nurse Dashboard - Ward A - Nurse Only - No Add Staff - Fixed</h2><p>Assigned Room, Assigned Patients, Add Vitals, Comment on Health, How Are Beds - Everything displayed in page - Not module - Clean</p></div>';html+='<div class="grid-3"><div class="card" style="margin:0"><small>Assigned Room</small><br><b>Ward A Medicine</b><br><b style="font-size:20px">Ward A-12</b><br><small>45/60 - Beds 42/120</small></div><div class="card" style="margin:0"><small>Assigned Patients</small><br><b style="font-size:20px">'+assigned.length+'</b><br><small>Mary Wanjiku, Amina Yusuf</small></div><div class="card" style="margin:0"><small>How Are Beds 42/120</small><br><b style="font-size:20px">42 / 120</b><br><small>Ward A 45/60, ICU 3/10, Maternity 12/20</small></div></div>';html+='<div class="card"><h2>My Assigned Patients - Everything in Page - Clean</h2><div class="table-wrap"><table class="table"><thead><tr><th>Patient ID</th><th>Patient</th><th>Room</th><th>Diagnosis</th><th>Vitals</th><th>Health Comment</th><th>Action</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';document.getElementById("main").innerHTML=html;}

function saveVitals(){var pid=document.getElementById("vPatient").value;var bp=document.getElementById("vBP").value.trim();var temp=document.getElementById("vTemp").value.trim();var pulse=document.getElementById("vPulse").value.trim();var spo2=document.getElementById("vSPO2").value.trim();var comment=document.getElementById("vComment").value.trim();var res=document.getElementById("vResult");if(!bp||!temp||!pulse||!spo2||!comment){res.innerHTML='<span style="color:#DC2626">Fill all vitals and comment</span>';return;}for(var i=0;i<patients.length;i++){if(patients[i].id===pid){patients[i].vitals={bp:bp,temp:temp,pulse:pulse,spo2:spo2};patients[i].nursingNote=comment;res.innerHTML='<span style="color:#166534">Vitals saved for '+patients[i].name+' - Working! Evidence</span>';break;}}var rows="";for(var i=0;i<patients.length;i++){var p=patients[i];rows+="<tr><td><b>"+p.name+"</b> - "+p.id+"</td><td>"+p.room+"</td><td>"+p.vitals.bp+"</td><td>"+p.vitals.temp+"</td><td>"+p.vitals.pulse+"</td><td>"+p.vitals.spo2+"</td><td>"+p.nursingNote+"</td></tr>";}document.getElementById("vitalsTable").innerHTML=rows;}

function showDoctorPage(){var rows="";for(var i=0;i<patients.length;i++){var p=patients[i];rows+="<tr><td><b>"+p.name+"</b></td><td>"+p.id+"</td><td>"+p.room+"</td><td>"+p.diagnosis+"</td><td>"+p.vitals.bp+", "+p.vitals.temp+", "+p.vitals.pulse+"</td><td>"+p.nursingNote+"</td><td><span class=\"badge b-green\">"+p.status+"</span></td></tr>";}var prescRows="";for(var i=0;i<prescriptions.length;i++){var pr=prescriptions[i];prescRows+="<tr><td><b>"+pr.patient+"</b></td><td>"+pr.medicine+"</td><td>"+pr.dosage+"</td></tr>";}var apptRows="";for(var i=0;i<appointments.length;i++){var a=appointments[i];apptRows+="<tr><td>"+a.date+"</td><td><b>"+a.patient+"</b></td><td><span class=\"badge b-green\">"+a.status+"</span></td><td><button class=\"btn-white\" style=\"padding:5px 10px;font-size:11px\" onclick=\"confirmAppt("+i+")\">Confirm</button></td></tr>";}var html='<div class="card"><h2>Doctor Dashboard - Doctor Only - Separate - Clean Not Stuffy</h2><p>My Patients - Vitals from Nurse - Health Comment - Everything displayed in page - 3 patients - Not stuffy - Spacious</p><div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>ID</th><th>Room</th><th>Diagnosis</th><th>Vitals from Nurse</th><th>Health Comment</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';html+='<div class="grid-2"><div class="card" style="margin:0"><h2>Write Condition</h2><label style="font-size:12px;font-weight:600">Select Patient</label><select id="cPatient" class="input"><option value="P-001245">Mary Wanjiku - Ward A-12 Bed 4</option></select><label style="font-size:12px;font-weight:600">Clinical Notes</label><textarea id="cDetail" class="input" style="height:120px" placeholder="Enter clinical notes..."></textarea><button class="btn btn-dark" style="margin-top:12px;width:100%" onclick="saveCondition()">Save Condition Notes</button><div id="cResult" style="margin-top:8px;font-size:12px"></div></div><div class="card" style="margin:0"><h2>Prescribe Medicine</h2>< function confirmAppt(i){appointments[i].status="Confirmed";showDoctorPage();}

function showMyBills(){var rows="";for(var i=0;i<payments.length;i++){var pay=payments[i];rows+="<tr><td>"+pay.date+"</td><td>KSh "+pay.amount+"</td><td>"+pay.payment+"</td><td>"+pay.receipt+"</td><td><span class=\"badge b-green\">"+pay.status+"</span></td></tr>";}var html='<div class="card"><h2>My Bills - Pay Bill - Working</h2><div class="grid-2" style="margin-top:16px"><div><label style="font-size:12px;font-weight:600">M-Pesa Code</label><input id="mpesaCode" class="input" placeholder="QGH7Y3"><label style="font-size:12px;font-weight:600">Amount - KSh</label><input id="payAmount" class="input" type="number" placeholder="3500"><button class="btn btn-dark" style="margin-top:12px;width:100%" onclick="payBill()">Pay Bill with M-Pesa</button><div id="payResult" style="margin-top:8px;font-size:12px"></div></div><div><div class="table-wrap" style="margin:0"><table class="table"><thead><tr><th>Date</th><th>Amount</th><th>Payment</th><th>Receipt</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></div></div></div>';document.getElementById("main").innerHTML=html;}
