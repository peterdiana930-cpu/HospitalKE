.s-group{font-size:10px;font-weight:700;letter-spacing:.8px;color:#6B7280;margin:18px 0 6px 12px;text-transform:uppercase}

.s-link:hover{background:#1F2937;color:#fff} .s-link.active{background:var(--white);color:var(--navy);font-weight:600}
.main{flex:1;background:var(--bg);padding:20px;overflow-y:auto}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:4px} .card p{font-size:12px;color:var(--muted);margin-bottom:12px}
.grid-4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;margin-bottom:16px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;justify-content:space-between}
.table-wrap{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--white)}
.table{width:100%;border-collapse:collapse;min-width:700px}
.table th{background:#F9FAFB;padding:11px 12px;text-align:left;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--line)}
.table td{padding:12px;font-size:13px;border-bottom:1px solid #F3F4F6}
.badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:700}
.b-green{background:#DCFCE7;color:#166534} .b-blue{background:#DBEAFE;color:#1E40AF} .b-amber{background:#FEF3C7;color:#92400E}
.hidden{display:none}
@media(max-width:1000px){.grid-4,.grid-2{grid-template-columns:1fr 1fr}.app{flex-direction:column}.sidebar{width:100%}}
@media(max-width:600px){.grid-4,.grid-2{grid-template-columns:1fr}}

<script>
let users={admin:"admin123",doctor:"doctor123",nurse:"nurse123",reception:"recep123"};
let staffs=[

{id:'S-002',name:'Grace Wanjiku',role:'Nurse',dept:'Ward A',phone:'0712345002',status:'Active'},

function setTab(t){
document.getElementById('bStaff').style.background=t==='staff'?'#fff':'transparent';
document.getElementById('bPatient').style.background=t==='patient'?'#fff':'transparent';
document.getElementById('staffBox').classList.toggle('hidden',t!=='staff');
document.getElementById('patientBox').classList.toggle('hidden',t!=='patient');
}
function login(type){
let err=document.getElementById('err');
if(type==='patient'){
let id=document.getElementById('pid').value.toUpperCase().trim(),ph=document.getElementById('pphone').value.trim();
if(id!=='P-001245'||ph!=='0712345678'){err.textContent='Use P-001245 / 0712345678';err.classList.remove('hidden');return;}
openApp('patient');
}else{
let u=document.getElementById('u').value.toLowerCase().trim(),p=document.getElementById('p').value.trim();
if(!users[u]||users[u]!==p){err.textContent='Wrong username/password. Use admin/admin123';err.classList.remove('hidden');return;}
openApp(u);
}
}
function openApp(role){
document.getElementById('loginScreen').classList.add('hidden');
document.getElementById('topBar').classList.remove('hidden');
document.getElementById('app').classList.remove('hidden');
document.getElementById('roleBadge').textContent=role.toUpperCase();
buildSidebar(role);
showDashboard();
}

<a class="s-link" onclick="showInsurance()"><i class="fa-solid fa-shield-halved"></i> Insurance Claims</a>
<a class="s-link" onclick="showProcurement()"><i class="fa-solid fa-cart-shopping"></i> Procurement</a>
<a class="s-link" onclick="showInventory()"><i class="fa-solid fa-boxes-stacked"></i> Inventory</a>
<a class="s-link" onclick="showPayroll()"><i class="fa-solid fa-money-bill"></i> Payroll</a>
<a class="s-link" onclick="showAccounting()"><i class="fa-solid fa-calculator"></i> Financial Accounting</a>

<div class="s-group">F. Intelligence & Reporting</div>
<a class="s-link" onclick="showAnalytics()"><i class="fa-solid fa-chart-line"></i> Hospital Performance Analytics</a>
<a class="s-link" onclick="showRevenue()"><i class="fa-solid fa-chart-bar"></i> Revenue Reports</a>
<a class="s-link" onclick="showPatientStats()"><i class="fa-solid fa-users"></i> Patient Statistics</a>`;
}else{
html+=`<div class="s-group">My Portal - Patient</div>
<a class="s-link active" onclick="showMyRecords()"><i class="fa-solid fa-file-medical"></i> My Records</a>
<a class="s-link" onclick="showMyBills()"><i class="fa-solid fa-file-invoice-dollar"></i> My Bills - Pay Bill</a>

<a class="s-link" onclick="showMyPresc()"><i class="fa-solid fa-pills"></i> My Prescriptions</a>`;
}
html+=`<div style="margin-top:20px;padding:12px;background:#1F2937;border-radius:12px"><b style="font-size:11px;color:#fff">Owner 0756255760</b><br><small style="font-size:10px;color:#9CA3AF">A-F Modules Complete • Professional • No wordy text</small></div>`;

}

function showDashboard(){
document.getElementById('main').innerHTML=`
<div class="grid-4">

<div class="stat"><div><small style="font-size:11px;color:#6B7280">Total Patients</small><br><b style="font-size:22px">${patients.length}</b><br><small>Clinical - B</small></div><div style="width:44px;height:44px;background:#DCFCE7;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#166534"><i class="fa-solid fa-users"></i></div></div>
<div class="stat"><div><small style="font-size:11px;color:#6B7280">Available Beds</small><br><b style="font-size:22px">42 / 120</b><br><small>Operations - C</small></div><div style="width:44px;height:44px;background:#FEF3C7;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#92400E"><i class="fa-solid fa-bed"></i></div></div>
<div class="stat"><div><small style="font-size:11px;color:#6B7280">Revenue Today</small><br><b style="font-size:22px">KSh 84,200</b><br><small>Financial - E</small></div><div style="width:44px;height:44px;background:#F3F4F6;border-radius:10px;display:flex;align-items:center;justify-content:center"><i class="fa-solid fa-chart-line"></i></div></div>

<div class="card">
<h2>A. Administration - User Accounts & Permissions - Where to Add Staffs - COMPLETE</h2>

<input id="sRole" class="input" placeholder="Role - Doctor, Nurse, Receptionist, Pharmacist, Lab Tech">

</div>
<button class="btn btn-dark" style="margin-top:12px" onclick="addStaff()"><i class="fa-solid fa-user-plus"></i> Add Staff - Working</button>

<div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Role - Permissions</th><th>Department - Branches</th><th>Phone</th><th>Status</th></tr></thead><tbody id="stable">${staffs.map(s=>`<tr><td>${s.id}</td><td><b>${s.name}</b></td><td>${s.role}</td><td>${s.dept}</td><td>${s.phone}</td><td><span class="badge b-green">${s.status}</span></td></tr>`).join('')}</tbody></table></div>
</div>

<div id="pResult" style="margin-top:8px;font-size:12px"></div>
<div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Ward</th><th>Diagnosis</th><th>Doctor</th><th>Status</th></tr></thead><tbody id="ptable">${patients.map(p=>`<tr><td>${p.id}</td><td><b>${p.name}</b></td><td>${p.phone}</td><td>${p.room}</td><td>${p.diagnosis}</td><td>${p.doctor}</td><td><span class="badge b-blue">${p.status}</span></td></tr>`).join('')}</tbody></table></div>
</div>

}

function addStaff(){
let n=document.getElementById('sName').value.trim(),r=document.getElementById('sRole').value.trim(),d=document.getElementById('sDept').value.trim(),ph=document.getElementById('sPhone').value.trim(),res=document.getElementById('sResult');
if(!n||!r||!d||!ph){res.innerHTML='<span style="color:#DC2626">Fill all fields - Add Staff</span>';return;}
let id='S-00'+(staffs.length+1);
staffs.push({id:id,name:n,role:r,dept:d,phone:ph,status:'Active'});
res.innerHTML='<span style="color:#166534">✓ Staff added: '+id+' - '+n+' - '+r+' - '+d+'</span>';
document.getElementById('stable').innerHTML=staffs.map(s=>`<tr><td>${s.id}</td><td><b>${s.name}</b></td><td>${s.role}</td><td>${s.dept}</td><td>${s.phone}</td><td><span class="badge b-green">${s.status}</span></td></tr>`).join('');
document.getElementById('sName').value='';document.getElementById('sRole').value='';document.getElementById('sDept').value='';document.getElementById('sPhone').value='';
}
function addPatient(){
let n=document.getElementById('pName').value.trim(),ph=document.getElementById('pPhone').value.trim(),r=document.getElementById('pRoom').value.trim(),d=document.getElementById('pDoctor').value.trim(),diag=document.getElementById('pDiagnosis').value.trim(),res=document.getElementById('pResult');
if(!n||!ph||!r||!diag){res.innerHTML='<span style="color:#DC2626">Fill all fields - Add Patient</span>';return;}
let id='P-00'+(1245+patients.length+1); patients.push({id:id,name:n,phone:ph,room:r,diagnosis:diag,doctor:d||'Dr Kimani',status:'Admitted'});
res.innerHTML='<span style="color:#166534">✓ Patient added: '+id+' - '+n+'</span>';
document.getElementById('ptable').innerHTML=patients.map(p=>`<tr><td>${p.id}</td><td><b>${p.name}</b></td><td>${p.phone}</td><td>${p.room}</td><td>${p.diagnosis}</td><td>${p.doctor}</td><td><span class="badge b-blue">${p.status}</span></td></tr>`).join('');
}
