<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HospitalKE - Permanent</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<h1>HospitalKE - Permanent Supabase</h1>
<p>✅ Patients NEVER disappear again!</p>

<input id="name" placeholder="Patient Name">
<input id="county" placeholder="County">
<input id="condition" placeholder="Condition">
<input id="age" type="number" placeholder="Age">
<button onclick="addPatient()">Add Patient</button>

<div id="list"></div>

<script>
const SUPABASE_URL = 'https://xhguvilkavzkydkkeajgf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tapBaeOUfFI-Ax1r6XtVdw_8VDqAzNg';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadPatients(){
  const {data} = await supabaseClient.from('patients').select('*').order('id',{ascending:false});
  document.getElementById('list').innerHTML = data.map(p=>`<p>${p.id}. ${p.name} - ${p.county} - ${p.condition}</p>`).join('');
}
async function addPatient(){
  const name=document.getElementById('name').value;
  const county=document.getElementById('county').value;
  const condition=document.getElementById('condition').value;
  const age=document.getElementById('age').value||25;
  await supabaseClient.from('patients').insert([{name,county,condition,age:parseInt(age)}]);
  alert('Saved permanently!');
  loadPatients();
}
loadPatients();
</script>
</body>
</html>
